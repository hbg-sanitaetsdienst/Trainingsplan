<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Mein Trainingsplan</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f8;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px 16px;background:linear-gradient(130deg,#172c4b,#102036);border-bottom:1px solid #30405b}main{max-width:780px;margin:auto;padding:16px 14px 90px}h1{font-size:25px;margin:0 0 7px}h2{font-size:19px;margin:0 0 12px}p{color:#a9b9cd}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 13px;background:#26364e;color:#f3f7ff}button.primary{background:#43c5a3;color:#071c1a;font-weight:750}button.danger{color:#ffb8b8}button:disabled{opacity:.4}nav{display:flex;gap:7px;overflow:auto;padding:12px 0}nav button{white-space:nowrap}nav button.active{background:#43c5a3;color:#08221d;font-weight:700}.card{background:#152237;border:1px solid #2a3b55;border-radius:16px;padding:15px;margin:12px 0}.muted{color:#9eafc6;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.exercise{border-top:1px solid #2d3d55;padding:13px 0}.exercise:first-child{border-top:0}.exercise h3{margin:0 0 5px;font-size:16px}input,select{background:#0d192a;color:#fff;border:1px solid #42526c;border-radius:9px;padding:9px;min-width:0}input[type=number]{width:78px}input[type=text]{width:100%}label{display:block;color:#aabbd0;font-size:12px;margin-bottom:5px}.setrow{display:grid;grid-template-columns:32px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}.setrow input{width:100%}.setrow button{padding:9px 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;color:#71e2c5}.hidden{display:none!important}.small{font-size:12px}.stat{font-size:24px;font-weight:800;color:#70e2c3}.progress{height:8px;background:#263a51;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#43c5a3}.empty{text-align:center;padding:35px 10px}.footer{font-size:12px;color:#8799b0;text-align:center;padding:12px}textarea{width:100%;background:#0d192a;color:white;border:1px solid #42526c;border-radius:10px;padding:10px}dialog{border:1px solid #49617e;border-radius:16px;background:#14243a;color:#fff;max-width:min(92vw,500px);width:100%}dialog::backdrop{background:#000a}canvas{width:100%;height:190px} .check{accent-color:#43c5a3;width:22px;height:22px} @media(min-width:700px){header>div{max-width:780px;margin:auto}}
</style></head><body><header><div><h1>🏋️ Mein Trainingsplan</h1><div class="muted">Dein Training. Deine Fortschritte. Auf deinem Gerät.</div></div></header><main><nav id="tabs"><button data-tab="train" class="active">Training</button><button data-tab="plan">Plan bearbeiten</button><button data-tab="history">Verlauf</button><button data-tab="settings">Daten & Einstellungen</button></nav><section id="view"></section><div class="footer">Daten werden ausschließlich in diesem Browser gespeichert. Regelmäßig ein Backup exportieren.</div></main><dialog id="modal"><div id="modalBody"></div><div class="actions"><button onclick="document.querySelector('#modal').close()">Schließen</button></div></dialog><script>
const KEY='fittrack_v1';const defaults=[{id:'wed',name:'Mittwoch',focus:'Optional · Cardio / Wandern',warm:'',end:'45–60 Min. Laufband mit Steigung, moderates Tempo',exercises:[]},{id:'thu',name:'Donnerstag',focus:'Push + Beine',warm:'15–20 Min. lockeres Cardio',end:'20–30 Min. Cardio',exercises:[['Beinpresse',3,'8–12'],['Brustpresse oder Bankdrücken',3,'8–12'],['Schrägbank-Brustpresse / Kurzhanteln',3,'8–12'],['Schulterdrücken',3,'8–12'],['Seitheben',3,'12–15'],['Trizeps am Kabel',3,'10–15'],['Adduktoren-Maschine',3,'12–15'],['Plank',3,'30–60 Sek.']]},{id:'fri',name:'Freitag',focus:'Pull + Beine',warm:'15–20 Min. lockeres Cardio',end:'20–30 Min. Cardio',exercises:[['Beinbeuger',3,'10–15'],['Latzug',3,'8–12'],['Rudern sitzend',3,'8–12'],['Reverse Fly / hintere Schulter',3,'12–15'],['Bizepscurls',3,'10–15'],['Rückenstrecker',3,'10–15'],['Abduktoren-Maschine',3,'12–15'],['Crunch-Maschine / Kabel',3,'10–15']]}].map(d=>({...d,exercises:d.exercises.map((x,i)=>({id:d.id+'_'+i,name:x[0],sets:x[1],reps:x[2]}))}));
const clone=x=>JSON.parse(JSON.stringify(x));let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.days)){state={days:clone(defaults),history:[],drafts:{},cardio:{},restSeconds:90}};state.history ||= [];state.drafts ||= {};state.cardio ||= {};state.restSeconds ||=90;let dayId='thu',tab='train',timer=null,timerEnd=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen und Daten exportieren.')}}function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function day(){return state.days.find(d=>d.id===dayId)||state.days[0]}function lastExercise(id){for(let i=state.history.length-1;i>=0;i--){let x=state.history[i].exercises.find(e=>e.id===id);if(x)return x}return null}function draft(){if(!state.drafts[dayId]){state.drafts[dayId]={started:new Date().toISOString(),sets:{},done:{},note:''};for(const e of day().exercises){const last=lastExercise(e.id);state.drafts[dayId].sets[e.id]=Array.from({length:e.sets},(_,i)=>({weight:last?.sets[i]?.weight??'',reps:last?.sets[i]?.reps??'',done:false}))}}return state.drafts[dayId]}
function render(){[...$('#tabs').children].forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#view').innerHTML=tab==='train'?trainHTML():tab==='plan'?planHTML():tab==='history'?historyHTML():settingsHTML();if(tab==='history')drawChart()}
function trainHTML(){let d=day(),dr=draft(),total=d.exercises.reduce((n,e)=>n+(dr.sets[e.id]||[]).length,0),done=Object.values(dr.sets).flat().filter(s=>s.done).length;return `<div class="row wrap"><h2>Training starten</h2><select id="dayChoice" onchange="dayId=this.value;render()">${state.days.map(x=>`<option value="${x.id}" ${x.id===dayId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="card"><div class="row"><div><h2>${esc(d.name)} · ${esc(d.focus)}</h2><div class="muted">${d.warm?'Aufwärmen: '+esc(d.warm):'Optionaler Ausdauertag'}</div></div><span class="pill">${done}/${total} Sätze</span></div><div class="progress" style="margin:13px 0"><div style="width:${total?done/total*100:0}%"></div></div><div class="muted">Abschluss: ${esc(d.end)}</div></div>${d.exercises.map(e=>{let sets=dr.sets[e.id]||[];return `<div class="card"><div class="row"><div><h3>${esc(e.name)}</h3><span class="muted">${e.sets} Sätze · Ziel: ${esc(e.reps)}</span></div><button onclick="showPrevious('${e.id}')">Letztes Mal</button></div><div class="setrow muted"><span>Satz</span><span>Gewicht (kg)</span><span>Wdh. / Sek.</span><span>Fertig</span></div>${sets.map((s,i)=>`<div class="setrow"><span>${i+1}</span><input aria-label="Gewicht Satz ${i+1}" type="number" min="0" step="0.5" value="${esc(s.weight)}" oninput="setField('${e.id}',${i},'weight',this.value)"><input aria-label="Wiederholungen Satz ${i+1}" type="number" min="0" step="1" value="${esc(s.reps)}" oninput="setField('${e.id}',${i},'reps',this.value)"><input class="check" type="checkbox" ${s.done?'checked':''} onchange="setField('${e.id}',${i},'done',this.checked);render()"></div>`).join('')}</div>`}).join('')}${d.exercises.length?'':`<div class="card"><h3>Cardio-Einheit</h3><p>Trage Dauer, Distanz und Steigung ein.</p></div>`}<div class="card"><h3>Cardio dokumentieren</h3><div class="grid2"><div><label>Minuten</label><input id="cardioMin" type="number" min="0" value="${esc(state.cardio[dayId]?.minutes||'')}"></div><div><label>Distanz (km)</label><input id="cardioKm" type="number" min="0" step="0.1" value="${esc(state.cardio[dayId]?.km||'')}"></div><div><label>Steigung (%)</label><input id="cardioSlope" type="number" min="0" step="0.5" value="${esc(state.cardio[dayId]?.slope||'')}"></div></div><div style="margin-top:12px"><label>Notizen</label><textarea id="notes" rows="2">${esc(dr.note||'')}</textarea></div></div><div class="card"><div class="row"><h3>Pausentimer</h3><span id="timerDisplay" class="stat">${state.restSeconds}s</span></div><div class="actions"><button onclick="startTimer()">▶ Start</button><button onclick="stopTimer()">Stopp</button><button onclick="state.restSeconds=Math.max(15,state.restSeconds-15);save();render()">−15s</button><button onclick="state.restSeconds+=15;save();render()">+15s</button></div></div><div class="actions"><button class="primary" onclick="finish()">✓ Training speichern</button><button class="danger" onclick="resetDraft()">Eingaben zurücksetzen</button></div>`}
function setField(id,i,key,value){draft().sets[id][i][key]=value;save()}function showPrevious(id){let x=lastExercise(id);$('#modalBody').innerHTML=x?`<h2>Letzter Eintrag</h2>${x.sets.map((s,i)=>`<p>Satz ${i+1}: ${esc(s.weight||'–')} kg · ${esc(s.reps||'–')} Wdh.</p>`).join('')}`:'<h2>Noch kein Eintrag</h2><p>Nach dem ersten gespeicherten Training erscheinen hier deine Werte.</p>';$('#modal').showModal()}
function finish(){let d=day(),dr=draft();let cardio={minutes:$('#cardioMin').value,km:$('#cardioKm').value,slope:$('#cardioSlope').value};dr.note=$('#notes').value;let hasSets=Object.values(dr.sets).flat().some(s=>s.done||s.weight||s.reps);if(!hasSets&&!cardio.minutes&&!cardio.km){alert('Bitte zuerst mindestens einen Satz oder Cardio eintragen.');return}state.history.push({id:uid(),date:new Date().toISOString(),dayId:d.id,dayName:d.name,exercises:d.exercises.map(e=>({id:e.id,name:e.name,sets:clone(dr.sets[e.id]||[])})),cardio,note:dr.note});delete state.drafts[dayId];delete state.cardio[dayId];save();alert('Training gespeichert!');tab='history';render()}
function resetDraft(){if(confirm('Alle aktuellen Eingaben dieses Tages zurücksetzen?')){delete state.drafts[dayId];delete state.cardio[dayId];save();render()}}function startTimer(){stopTimer();timerEnd=Date.now()+state.restSeconds*1000;timer=setInterval(()=>{let n=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));let el=$('#timerDisplay');if(el)el.textContent=n+'s';if(!n){stopTimer();if(navigator.vibrate)navigator.vibrate([180,100,180])}},200)}function stopTimer(){if(timer)clearInterval(timer);timer=null}
function planHTML(){return `<h2>Trainingsplan bearbeiten</h2><p class="muted">Änderungen gelten für zukünftige Einheiten. Bereits gespeicherte Trainings bleiben erhalten.</p>${state.days.map(d=>`<div class="card"><div class="row"><h2>${esc(d.name)}</h2><span class="pill">${esc(d.focus)}</span></div><label>Schwerpunkt</label><input type="text" value="${esc(d.focus)}" onchange="updateDay('${d.id}','focus',this.value)"><div class="grid2" style="margin-top:10px"><div><label>Warm-up</label><input type="text" value="${esc(d.warm)}" onchange="updateDay('${d.id}','warm',this.value)"></div><div><label>Cardio-Abschluss</label><input type="text" value="${esc(d.end)}" onchange="updateDay('${d.id}','end',this.value)"></div></div>${d.exercises.map((e,i)=>`<div class="exercise"><div class="row"><b>${esc(e.name)}</b><div><button title="Nach oben" onclick="moveExercise('${d.id}',${i},-1)">↑</button><button title="Nach unten" onclick="moveExercise('${d.id}',${i},1)">↓</button></div></div><div class="grid2" style="margin-top:9px"><div><label>Sätze</label><input type="number" min="1" max="12" value="${e.sets}" onchange="updateExercise('${d.id}','${e.id}','sets',this.value)"></div><div><label>Ziel-Wiederholungen</label><input type="text" value="${esc(e.reps)}" onchange="updateExercise('${d.id}','${e.id}','reps',this.value)"></div></div><div class="actions"><button onclick="renameExercise('${d.id}','${e.id}')">Umbenennen</button><button class="danger" onclick="removeExercise('${d.id}','${e.id}')">Entfernen</button></div></div>`).join('')}<div class="actions"><button class="primary" onclick="addExercise('${d.id}')">+ Übung hinzufügen</button></div></div>`).join('')}`}
function updateDay(id,k,v){state.days.find(d=>d.id===id)[k]=v;save()}function updateExercise(did,eid,k,v){let e=state.days.find(d=>d.id===did).exercises.find(e=>e.id===eid);e[k]=k==='sets'?Math.max(1,Math.min(12,Number(v)||1)):v;delete state.drafts[did];save();render()}function renameExercise(did,eid){let e=state.days.find(d=>d.id===did).exercises.find(e=>e.id===eid),v=prompt('Neuer Übungsname',e.name);if(v?.trim()){e.name=v.trim();save();render()}}function addExercise(id){let name=prompt('Name der neuen Übung');if(!name?.trim())return;state.days.find(d=>d.id===id).exercises.push({id:uid(),name:name.trim(),sets:3,reps:'8–12'});delete state.drafts[id];save();render()}function removeExercise(id,eid){if(!confirm('Übung aus dem Plan entfernen?'))return;let d=state.days.find(d=>d.id===id);d.exercises=d.exercises.filter(e=>e.id!==eid);delete state.drafts[id];save();render()}function moveExercise(id,i,dir){let a=state.days.find(d=>d.id===id).exercises,j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function historyHTML(){let h=[...state.history].reverse();let options=[...new Map(state.history.flatMap(x=>x.exercises).map(e=>[e.id,e.name])).entries()];return `<h2>Trainingsverlauf</h2><div class="card"><div class="row"><span class="muted">Gespeicherte Einheiten</span><span class="stat">${h.length}</span></div></div>${options.length?`<div class="card"><h3>Gewichtsverlauf</h3><select id="chartExercise" onchange="drawChart()">${options.map(([id,name])=>`<option value="${esc(id)}">${esc(name)}</option>`).join('')}</select><canvas id="chart" width="700" height="230"></canvas><p class="muted">Höchstes eingetragenes Gewicht pro Training (kg).</p></div>`:''}${h.length?h.map(x=>`<div class="card"><div class="row"><div><h3>${esc(x.dayName)} · ${new Date(x.date).toLocaleDateString('de-DE')}</h3><span class="muted">${new Date(x.date).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span></div><button class="danger" onclick="deleteHistory('${x.id}')">Löschen</button></div><div class="muted">${x.exercises.filter(e=>e.sets.some(s=>s.done||s.weight||s.reps)).map(e=>`${esc(e.name)}: ${e.sets.filter(s=>s.done||s.weight||s.reps).map(s=>`${esc(s.weight||'–')} kg × ${esc(s.reps||'–')}`).join(' / ')}`).join('<hr style="border:0;border-top:1px solid #2a3b55">')||'Nur Cardio'}</div>${x.cardio?.minutes?`<p class="small">Cardio: ${esc(x.cardio.minutes)} Min. · ${esc(x.cardio.km||'–')} km · ${esc(x.cardio.slope||'–')} % Steigung</p>`:''}${x.note?`<p>${esc(x.note)}</p>`:''}</div>`).join(''):'<div class="empty">Noch keine Einheiten gespeichert.</div>'}`}
function drawChart(){let c=$('#chart'),sel=$('#chartExercise');if(!c||!sel)return;let id=sel.value,points=state.history.map(h=>{let e=h.exercises.find(e=>e.id===id),v=e?Math.max(0,...e.sets.map(s=>Number(s.weight)||0)):0;return v?{date:h.date,v}:null}).filter(Boolean);let ctx=c.getContext('2d'),w=c.width,hh=c.height;ctx.clearRect(0,0,w,hh);ctx.strokeStyle='#3b526b';ctx.lineWidth=1;for(let i=0;i<4;i++){let y=20+i*60;ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-20,y);ctx.stroke()}if(!points.length){ctx.fillStyle='#a9b9cd';ctx.font='20px sans-serif';ctx.fillText('Noch keine Gewichtsdaten',60,120);return}let max=Math.max(...points.map(p=>p.v),1),min=0;ctx.strokeStyle='#43c5a3';ctx.lineWidth=4;ctx.beginPath();points.forEach((p,i)=>{let x=points.length===1?w/2:40+i*(w-65)/(points.length-1),y=hh-25-(p.v-min)/(max-min)*(hh-55);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#b5eadd';ctx.font='15px sans-serif';ctx.fillText(max+' kg',4,22);ctx.fillText(points.length+' Einträge',w-115,hh-4)}function deleteHistory(id){if(confirm('Diesen Trainingseintrag unwiderruflich löschen?')){state.history=state.history.filter(h=>h.id!==id);save();render()}}
function settingsHTML(){return `<h2>Daten & Einstellungen</h2><div class="card"><h3>Backup</h3><p>Exportiere deine Daten regelmäßig als JSON-Datei. Beim Import werden die aktuell gespeicherten Daten ersetzt.</p><div class="actions"><button class="primary" onclick="exportData()">↓ Backup exportieren</button><button onclick="$('#importFile').click()">↑ Backup importieren</button><input class="hidden" id="importFile" type="file" accept="application/json,.json" onchange="importData(this.files[0])"></div></div><div class="card"><h3>Plan zurücksetzen</h3><p>Setzt nur die Übungen und Trainingstage auf die Vorlage zurück. Dein Trainingsverlauf bleibt erhalten.</p><button onclick="resetPlan()">Standardplan wiederherstellen</button></div><div class="card"><h3>Alle Daten löschen</h3><p>Löscht sämtliche Trainingseinträge, Pläne und Einstellungen auf diesem Gerät.</p><button class="danger" onclick="clearAll()">Alle lokalen Daten löschen</button></div><div class="card"><h3>Datenschutz</h3><p>Keine Anmeldung, keine Cloud und kein Tracking. Deine Einträge bleiben im lokalen Speicher dieses Browsers. Browserdaten löschen oder Privatmodus kann sie entfernen. Andere Geräte sehen sie nicht automatisch.</p></div>`}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trainingsapp-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let v=JSON.parse(await file.text());if(!Array.isArray(v.days)||!Array.isArray(v.history)||!v.days.every(d=>typeof d.id==='string'&&Array.isArray(d.exercises)))throw Error('Ungültiges Format');if(!confirm('Alle aktuellen lokalen Daten durch das Backup ersetzen?'))return;state=v;state.drafts||={};state.cardio||={};state.restSeconds||=90;dayId=state.days[0].id;save();render();alert('Backup importiert')}catch(e){alert('Import fehlgeschlagen: '+e.message)}}function resetPlan(){if(confirm('Den bearbeiteten Plan durch den Standardplan ersetzen?')){state.days=clone(defaults);state.drafts={};save();render()}}function clearAll(){if(confirm('Wirklich ALLE Daten löschen?')&&confirm('Letzte Bestätigung: Es gibt keine Wiederherstellung ohne Backup.')){localStorage.removeItem(KEY);location.reload()}}
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;stopTimer();render()}});render();
</script></body></html>
